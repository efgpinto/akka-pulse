# Akka Pulse configuration

# Build-time topic publishing mode for SyntheticTopicProducer (feature 002).
# - origin-only:  publish an event only from its origin region (exactly once across regions)
# - every-region: publish from every region (one message per region; regional-topic testing)
pulse.topic.publish-mode = origin-only
pulse.topic.publish-mode = ${?PULSE_TOPIC_PUBLISH_MODE}

# Local topic runs need a dev-mode broker. Disabled by default so non-topic runs are
# unaffected. Enable when exercising topic scenarios, e.g.:
#   mvn compile exec:java -Dakka.javasdk.dev-mode.eventing.support=kafka
# akka.javasdk.dev-mode.eventing.support = "kafka"
