# Akka Pulse configuration

# Topic components (SyntheticTopicProducer + SyntheticTopicConsumer, feature 002).
# They bind to a message broker. Disabled by default so the service starts in
# projects without a broker. Set PULSE_TOPIC_ENABLED=true (with a broker configured)
# to run the topic scenarios.
pulse.topic.enabled = false
pulse.topic.enabled = ${?PULSE_TOPIC_ENABLED}

# Build-time topic publishing mode for SyntheticTopicProducer (feature 002).
# - origin-only:  publish an event only from its origin region (exactly once across regions)
# - every-region: publish from every region (one message per region; regional-topic testing)
pulse.topic.publish-mode = origin-only
pulse.topic.publish-mode = ${?PULSE_TOPIC_PUBLISH_MODE}

# Secret probe endpoint (feature 003).
# env-prefix: environment variables with this prefix are reported by the list probe.
# file-dir:   directory where file-mounted secrets are read.
pulse.secrets.env-prefix = "PULSE_"
pulse.secrets.env-prefix = ${?PULSE_SECRETS_ENV_PREFIX}
pulse.secrets.file-dir = "/secrets/pulse-test-file"
pulse.secrets.file-dir = ${?PULSE_SECRETS_FILE_DIR}

# Local topic runs need a dev-mode broker. Disabled by default so non-topic runs are
# unaffected. Enable when exercising topic scenarios, e.g.:
#   mvn compile exec:java -Dakka.javasdk.dev-mode.eventing.support=kafka
# akka.javasdk.dev-mode.eventing.support = "kafka"
