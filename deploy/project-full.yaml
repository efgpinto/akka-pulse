# Akka project descriptor for eduardo-playground-dev (feature 004).
# Derived from `akka project export`; this repository maps one-to-one to this project.
# Declares both services; pulse-peer is on demand — undeploy it outside s2s validation
# windows (apply only upserts declared resources, it does not delete undeclared ones).
#
# Prerequisites (secret VALUES are never exported and are not in this file):
#   akka secret create generic pulse-test --literal token=<value>     # secret probes
#   akka secret create generic grafana    --literal token=<value>     # observability export
#   akka secret create generic new-relic  --literal api-key=<value>   # observability export
#
# Migration from the pre-split service: `akka service undeploy akka-pulse` and
# `akka route delete akka-pulse` first — the route below reuses its hostname for pulse-core.
# The rename discards the old service's persisted synthetic state (fine for a test service).
#
# Replace <image-tag> with the pushed tag (CI pushes docker.io/efgpinto/pulse-core:<short-sha>).
#
# Apply:
#   mvn clean install -DskipTests
#   akka project apply -f deploy/project-full.yaml
#
# pulse-peer has no route on purpose: reach its probes with `akka service proxy pulse-peer`
# (or add a route if internet access is preferred):
#   GET /peer/probes/direct       -> passed=true (s2s HTTP call to pulse-core)
#   GET /peer/probes/stream       -> passed=true after creating a record on pulse-core
#   GET /peer/probes/restricted   -> passed=true (ACL allows only pulse-peer)
#   GET /pulse/internal/ping on pulse-core from the internet -> denied (403)
#
# Tear down afterwards: `akka service undeploy pulse-peer` (apply does not delete resources
# that are merely absent from the descriptor). pulse-core is unaffected.
metadata:
  name: eduardo-playground-dev
resource: Project
resourceVersion: v1
spec:
  organization: eduardo-super-org
  regions:
  - aws-us-east-2
---
metadata:
  name: pulse-core
resource: Service
resourceVersion: v1
spec:
  env:
  - name: PULSE_TEST_SECRET
    valueFrom:
      secretKeyRef:
        key: token
        name: pulse-test
  image: docker.io/efgpinto/pulse-core:<image-tag>
  resources:
    autoscaling:
      minInstances: 1
    instanceType: g1.general.x-small
    runtime:
      mode: embedded
  volumeMounts:
  - mountPath: /secrets/pulse-test-file
    secret:
      secretName: pulse-test
  workloadIdentity: {}
---
metadata:
  name: pulse-core
resource: Route
resourceVersion: v1
spec:
  host: quiet-rain-1815.aws-us-east-2.apps.akka.dev
  routes:
  - prefix: /
    route:
      service: pulse-core
  tls: {}
---
metadata:
  name: pulse-peer
resource: Service
resourceVersion: v1
spec:
  image: docker.io/efgpinto/pulse-peer:<image-tag>
  resources:
    autoscaling:
      minInstances: 1
    instanceType: g1.general.x-small
    runtime:
      mode: embedded
  workloadIdentity: {}
---
resource: Observability
resourceVersion: v2
spec:
  exporters:
  - otlpHttp:
      endpointBaseUrl: https://otlp-gateway-prod-eu-west-2.grafana.net/otlp
      headers:
      - name: Authorization
        valueFrom:
          secretKeyRef:
            key: token
            name: grafana
      tls: {}
  - otlpHttp:
      endpointBaseUrl: https://otlp.nr-data.net
      headers:
      - name: api-key
        valueFrom:
          secretKeyRef:
            key: api-key
            name: new-relic
      tls: {}
  traceSampling:
    probabilistic:
      percentage: "10"
