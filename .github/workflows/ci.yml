name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DOCKER_IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/akka-pulse

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Configure Akka repository
        env:
          AKKA_REPO_URL: ${{ secrets.AKKA_REPO_URL }}
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<EOF
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
            xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
            xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0
                                https://maven.apache.org/xsd/settings-1.0.0.xsd">
            <profiles>
              <profile>
                <id>akka-repo</id>
                <repositories>
                  <repository>
                    <id>akka-repository</id>
                    <url>${AKKA_REPO_URL}</url>
                  </repository>
                </repositories>
                <pluginRepositories>
                  <pluginRepository>
                    <id>akka-plugin-repository</id>
                    <url>${AKKA_REPO_URL}</url>
                  </pluginRepository>
                </pluginRepositories>
              </profile>
            </profiles>
            <activeProfiles>
              <activeProfile>akka-repo</activeProfile>
            </activeProfiles>
          </settings>
          EOF

      - name: Compile
        run: mvn compile

      - name: Unit tests
        run: mvn test

      - name: Integration tests
        run: mvn verify -DskipTests
        env:
          JWT_ISSUER: test-issuer

  push-image:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Configure Akka repository
        env:
          AKKA_REPO_URL: ${{ secrets.AKKA_REPO_URL }}
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<EOF
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
            xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
            xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0
                                https://maven.apache.org/xsd/settings-1.0.0.xsd">
            <profiles>
              <profile>
                <id>akka-repo</id>
                <repositories>
                  <repository>
                    <id>akka-repository</id>
                    <url>${AKKA_REPO_URL}</url>
                  </repository>
                </repositories>
                <pluginRepositories>
                  <pluginRepository>
                    <id>akka-plugin-repository</id>
                    <url>${AKKA_REPO_URL}</url>
                  </pluginRepository>
                </pluginRepositories>
              </profile>
            </profiles>
            <activeProfiles>
              <activeProfile>akka-repo</activeProfile>
            </activeProfiles>
          </settings>
          EOF

      - name: Set short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::6}" >> $GITHUB_ENV

      - name: Build container image
        run: mvn clean install -DskipTests -Ddocker.tag=${{ env.SHORT_SHA }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag and push image
        run: |
          docker tag akka-pulse:${{ env.SHORT_SHA }} ${{ env.DOCKER_IMAGE }}:${{ env.SHORT_SHA }}
          docker tag akka-pulse:${{ env.SHORT_SHA }} ${{ env.DOCKER_IMAGE }}:latest
          docker push ${{ env.DOCKER_IMAGE }}:${{ env.SHORT_SHA }}
          docker push ${{ env.DOCKER_IMAGE }}:latest
