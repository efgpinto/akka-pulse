name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DOCKER_IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/akka-pulse

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Configure Akka repository
        uses: ./.github/actions/configure-akka-repo
        with:
          akka-repo-url: ${{ secrets.AKKA_REPO_URL }}

      - name: Compile
        run: mvn compile

      - name: Unit tests
        run: mvn test

      - name: Integration tests
        run: mvn verify -DskipTests
        env:
          JWT_ISSUER: test-issuer

  snyk-sdk-scan:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Configure Akka repository
        uses: ./.github/actions/configure-akka-repo
        with:
          akka-repo-url: ${{ secrets.AKKA_REPO_URL }}

      - name: Build container image
        run: mvn clean install -DskipTests

      - name: Install Snyk CLI
        run: npm install -g snyk

      - name: List deployed SDK JARs
        run: ls -la target/docker/akka-pulse/latest/build/maven/

      - name: Snyk scan SDK dependencies
        run: snyk test --scan-all-unmanaged --severity-threshold=medium -- --target-dir=target/docker/akka-pulse/latest/build/maven/
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  push-image:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: false # temporarily disabled

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Configure Akka repository
        uses: ./.github/actions/configure-akka-repo
        with:
          akka-repo-url: ${{ secrets.AKKA_REPO_URL }}

      - name: Set short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::6}" >> $GITHUB_ENV

      - name: Build container image
        run: mvn clean install -DskipTests -Ddocker.tag=${{ env.SHORT_SHA }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag and push image
        run: |
          docker tag akka-pulse:${{ env.SHORT_SHA }} ${{ env.DOCKER_IMAGE }}:${{ env.SHORT_SHA }}
          docker tag akka-pulse:${{ env.SHORT_SHA }} ${{ env.DOCKER_IMAGE }}:latest
          docker push ${{ env.DOCKER_IMAGE }}:${{ env.SHORT_SHA }}
          docker push ${{ env.DOCKER_IMAGE }}:latest
