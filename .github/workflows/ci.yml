name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DOCKER_IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/akka-pulse

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Configure Akka repository
        env:
          AKKA_REPO_URL: ${{ secrets.AKKA_REPO_URL }}
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<EOF
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
            xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
            xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0
                                https://maven.apache.org/xsd/settings-1.0.0.xsd">
            <profiles>
              <profile>
                <id>akka-repo</id>
                <repositories>
                  <repository>
                    <id>akka-repository</id>
                    <url>${AKKA_REPO_URL}</url>
                  </repository>
                </repositories>
                <pluginRepositories>
                  <pluginRepository>
                    <id>akka-plugin-repository</id>
                    <url>${AKKA_REPO_URL}</url>
                  </pluginRepository>
                </pluginRepositories>
              </profile>
            </profiles>
            <activeProfiles>
              <activeProfile>akka-repo</activeProfile>
            </activeProfiles>
          </settings>
          EOF

      - name: Compile
        run: mvn compile

      - name: Unit tests
        run: mvn test

      - name: Integration tests
        run: mvn verify -DskipTests
        env:
          JWT_ISSUER: test-issuer

  snyk-sdk-scan:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Configure Akka repository
        env:
          AKKA_REPO_URL: ${{ secrets.AKKA_REPO_URL }}
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<EOF
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
            xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
            xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0
                                https://maven.apache.org/xsd/settings-1.0.0.xsd">
            <profiles>
              <profile>
                <id>akka-repo</id>
                <repositories>
                  <repository>
                    <id>akka-repository</id>
                    <url>${AKKA_REPO_URL}</url>
                  </repository>
                </repositories>
                <pluginRepositories>
                  <pluginRepository>
                    <id>akka-plugin-repository</id>
                    <url>${AKKA_REPO_URL}</url>
                  </pluginRepository>
                </pluginRepositories>
              </profile>
            </profiles>
            <activeProfiles>
              <activeProfile>akka-repo</activeProfile>
            </activeProfiles>
          </settings>
          EOF

      - name: Build container image
        run: mvn clean install -DskipTests

      - name: Install Snyk CLI
        run: npm install -g snyk

      - name: List deployed SDK JARs
        run: ls -la target/docker/akka-pulse/latest/build/maven/

      - name: Snyk scan SDK dependencies
        run: snyk test --scan-all-unmanaged --severity-threshold=medium -- --target-dir=target/docker/akka-pulse/latest/build/maven/
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  snyk-runtime-image-scan:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Snyk CLI
        run: npm install -g snyk

      - name: Snyk scan Akka runtime image
        run: snyk container test registry.akka.io/akka-runtime-postgres:1.6.12 --severity-threshold=medium
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  snyk-runtime-deps-scan:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Configure Akka repository
        env:
          AKKA_REPO_URL: ${{ secrets.AKKA_REPO_URL }}
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<EOF
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
            xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
            xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0
                                https://maven.apache.org/xsd/settings-1.0.0.xsd">
            <profiles>
              <profile>
                <id>akka-repo</id>
                <repositories>
                  <repository>
                    <id>akka-repository</id>
                    <url>${AKKA_REPO_URL}</url>
                  </repository>
                </repositories>
              </profile>
            </profiles>
            <activeProfiles>
              <activeProfile>akka-repo</activeProfile>
            </activeProfiles>
          </settings>
          EOF

      - name: Generate runtime dependencies pom
        run: |
          mkdir -p /tmp/runtime-deps-scan
          cat > /tmp/runtime-deps-scan/pom.xml <<'POMEOF'
          <project xmlns="http://maven.apache.org/POM/4.0.0"
            xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
            xsi:schemaLocation="http://maven.apache.org/POM/4.0.0
                                https://maven.apache.org/xsd/maven-4.0.0.xsd">
            <modelVersion>4.0.0</modelVersion>
            <groupId>com.example</groupId>
            <artifactId>runtime-deps-scan</artifactId>
            <version>1.0.0</version>
            <packaging>pom</packaging>
            <dependencies>
              <dependency>
                <groupId>io.akka</groupId>
                <artifactId>akka-runtime-dependencies</artifactId>
                <version>1.6.12</version>
              </dependency>
            </dependencies>
          </project>
          POMEOF

      - name: Resolve runtime dependencies
        run: mvn -f /tmp/runtime-deps-scan/pom.xml dependency:resolve -q

      - name: Install Snyk CLI
        run: npm install -g snyk

      - name: Snyk scan runtime dependencies
        run: snyk test --file=/tmp/runtime-deps-scan/pom.xml --severity-threshold=medium
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  push-image:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: false # temporarily disabled

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Configure Akka repository
        env:
          AKKA_REPO_URL: ${{ secrets.AKKA_REPO_URL }}
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<EOF
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
            xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
            xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0
                                https://maven.apache.org/xsd/settings-1.0.0.xsd">
            <profiles>
              <profile>
                <id>akka-repo</id>
                <repositories>
                  <repository>
                    <id>akka-repository</id>
                    <url>${AKKA_REPO_URL}</url>
                  </repository>
                </repositories>
                <pluginRepositories>
                  <pluginRepository>
                    <id>akka-plugin-repository</id>
                    <url>${AKKA_REPO_URL}</url>
                  </pluginRepository>
                </pluginRepositories>
              </profile>
            </profiles>
            <activeProfiles>
              <activeProfile>akka-repo</activeProfile>
            </activeProfiles>
          </settings>
          EOF

      - name: Set short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::6}" >> $GITHUB_ENV

      - name: Build container image
        run: mvn clean install -DskipTests -Ddocker.tag=${{ env.SHORT_SHA }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag and push image
        run: |
          docker tag akka-pulse:${{ env.SHORT_SHA }} ${{ env.DOCKER_IMAGE }}:${{ env.SHORT_SHA }}
          docker tag akka-pulse:${{ env.SHORT_SHA }} ${{ env.DOCKER_IMAGE }}:latest
          docker push ${{ env.DOCKER_IMAGE }}:${{ env.SHORT_SHA }}
          docker push ${{ env.DOCKER_IMAGE }}:latest
