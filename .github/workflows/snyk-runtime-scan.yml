name: Snyk Runtime Scan

on:
  workflow_dispatch:
    inputs:
      runtime_version:
        description: 'Akka runtime version (e.g. 1.6.12)'
        required: true
        type: string

jobs:
  # RECOMMENDED: scans only /opt/docker/akka/lib/ from the runtime image — the JARs
  # actually loaded at runtime for SDK 3.1+, with the sbt dependencyOverrides already
  # applied. Ground truth, no false positives from legacy Kalix libs.
  snyk-runtime-image-scan-akka-only:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build scan image (Akka runtime libs only, excludes legacy Kalix libs)
        run: |
          cat > /tmp/Dockerfile.scan <<EOF
          FROM registry.akka.io/akka-runtime-postgres:${{ inputs.runtime_version }} AS source
          FROM eclipse-temurin:21-jre-jammy
          COPY --from=source /opt/docker/akka/lib/ /opt/docker/akka/lib/
          EOF
          docker build --platform linux/amd64 -f /tmp/Dockerfile.scan -t akka-runtime-scan:${{ inputs.runtime_version }} .

      - name: Install Snyk CLI
        run: npm install -g snyk

      - name: Snyk scan Akka runtime libs
        run: snyk container test akka-runtime-scan:${{ inputs.runtime_version }} --severity-threshold=medium
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  # ALTERNATIVE: scans the full runtime image, including legacy Kalix libs in
  # /opt/docker/lib/ that are never loaded for SDK 3.1+ deployments. Produces
  # false positives (e.g. scram 3.2) but gives the complete image picture for
  # compliance/audit purposes.
  snyk-runtime-image-scan:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Snyk CLI
        run: npm install -g snyk

      - name: Snyk scan Akka runtime image
        run: snyk container test registry.akka.io/akka-runtime-postgres:${{ inputs.runtime_version }} --severity-threshold=medium
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  # ALTERNATIVE: scans the Maven dependency graph of akka-runtime-dependencies.
  # The published poms do not carry the sbt dependencyOverrides used to build the
  # image, so versions are pinned from the artifact's META-INF manifest to match
  # what actually ships. Kept because it reports dependency paths (image scans
  # don't), useful to trace where a vulnerable library comes from.
  snyk-runtime-deps-scan:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Configure Akka repository
        env:
          AKKA_REPO_URL: ${{ secrets.AKKA_REPO_URL }}
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<EOF
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
            xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
            xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0
                                https://maven.apache.org/xsd/settings-1.0.0.xsd">
            <profiles>
              <profile>
                <id>akka-repo</id>
                <repositories>
                  <repository>
                    <id>akka-repository</id>
                    <url>${AKKA_REPO_URL}</url>
                  </repository>
                </repositories>
              </profile>
            </profiles>
            <activeProfiles>
              <activeProfile>akka-repo</activeProfile>
            </activeProfiles>
          </settings>
          EOF

      - name: Generate runtime dependencies pom
        run: |
          RUNTIME_VERSION="${{ inputs.runtime_version }}"
          mkdir -p /tmp/runtime-deps-scan
          cd /tmp/runtime-deps-scan

          # Fetch the runtime-dependencies JAR; its META-INF manifest lists the exact
          # version of every dependency shipped in the runtime image (the sbt build
          # applies dependencyOverrides that are NOT reflected in the published poms).
          mvn -q org.apache.maven.plugins:maven-dependency-plugin:3.6.1:get \
            -Dartifact=io.akka:akka-runtime-dependencies:${RUNTIME_VERSION}:jar
          JAR=~/.m2/repository/io/akka/akka-runtime-dependencies/${RUNTIME_VERSION}/akka-runtime-dependencies-${RUNTIME_VERSION}.jar

          # Pin every manifest version via dependencyManagement so Maven resolves the
          # same versions the runtime actually ships, instead of stale transitives.
          unzip -p "$JAR" META-INF/akka-runtime-dependencies.properties \
            | awk -F'[%=]' '!/^#/ && /=/ {printf "        <dependency>\n          <groupId>%s</groupId>\n          <artifactId>%s</artifactId>\n          <version>%s</version>\n        </dependency>\n", $1, $2, $3}' > depmgmt.xml

          {
            cat <<'POMHEAD'
          <project xmlns="http://maven.apache.org/POM/4.0.0"
            xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
            xsi:schemaLocation="http://maven.apache.org/POM/4.0.0
                                https://maven.apache.org/xsd/maven-4.0.0.xsd">
            <modelVersion>4.0.0</modelVersion>
            <groupId>com.example</groupId>
            <artifactId>runtime-deps-scan</artifactId>
            <version>1.0.0</version>
            <packaging>pom</packaging>
            <dependencyManagement>
              <dependencies>
          POMHEAD
            cat depmgmt.xml
            cat <<POMTAIL
              </dependencies>
            </dependencyManagement>
            <dependencies>
              <dependency>
                <groupId>io.akka</groupId>
                <artifactId>akka-runtime-dependencies</artifactId>
                <version>${RUNTIME_VERSION}</version>
              </dependency>
            </dependencies>
          </project>
          POMTAIL
          } > pom.xml

      - name: Resolve runtime dependencies
        run: mvn -f /tmp/runtime-deps-scan/pom.xml dependency:resolve -q

      - name: Install Snyk CLI
        run: npm install -g snyk

      - name: Snyk scan runtime dependencies
        run: snyk test --file=/tmp/runtime-deps-scan/pom.xml --severity-threshold=medium
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
