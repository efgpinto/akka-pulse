name: Snyk Alternative Scans

on:
  workflow_dispatch:
    inputs:
      runtime_version:
        description: 'Akka runtime version (e.g. 1.6.15)'
        required: true
        type: string

jobs:
  # Scans the full runtime image, including legacy Kalix libs in
  # /opt/docker/lib/ that are never loaded for SDK 3.1+ deployments. Produces
  # false positives (e.g. scram 3.2) but gives the complete image picture for
  # compliance/audit purposes.
  snyk-runtime-image-scan:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Snyk CLI
        run: npm install -g snyk

      - name: Snyk scan Akka runtime image
        run: snyk container test registry.akka.io/akka-runtime-postgres:${{ inputs.runtime_version }} --severity-threshold=medium
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  # Naive scan of the Maven dependency graph of akka-runtime-dependencies. The
  # published poms do not carry the sbt dependencyOverrides used to build the
  # image, so this reports stale transitive versions that do not actually ship
  # (e.g. scram-common 3.2 instead of 3.4) — see snyk-runtime-manifest-scan in
  # the recommended workflow for the accurate version of this approach. Kept
  # because it reports dependency paths (image scans don't), useful to trace
  # where a vulnerable library comes from.
  snyk-runtime-deps-scan:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Configure Akka repository
        env:
          AKKA_REPO_URL: ${{ secrets.AKKA_REPO_URL }}
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<EOF
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
            xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
            xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0
                                https://maven.apache.org/xsd/settings-1.0.0.xsd">
            <profiles>
              <profile>
                <id>akka-repo</id>
                <repositories>
                  <repository>
                    <id>akka-repository</id>
                    <url>${AKKA_REPO_URL}</url>
                  </repository>
                </repositories>
              </profile>
            </profiles>
            <activeProfiles>
              <activeProfile>akka-repo</activeProfile>
            </activeProfiles>
          </settings>
          EOF

      - name: Generate runtime dependencies pom
        run: |
          mkdir -p /tmp/runtime-deps-scan
          cat > /tmp/runtime-deps-scan/pom.xml <<POMEOF
          <project xmlns="http://maven.apache.org/POM/4.0.0"
            xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
            xsi:schemaLocation="http://maven.apache.org/POM/4.0.0
                                https://maven.apache.org/xsd/maven-4.0.0.xsd">
            <modelVersion>4.0.0</modelVersion>
            <groupId>com.example</groupId>
            <artifactId>runtime-deps-scan</artifactId>
            <version>1.0.0</version>
            <packaging>pom</packaging>
            <dependencies>
              <dependency>
                <groupId>io.akka</groupId>
                <artifactId>akka-runtime-dependencies</artifactId>
                <version>${{ inputs.runtime_version }}</version>
              </dependency>
            </dependencies>
          </project>
          POMEOF

      - name: Resolve runtime dependencies
        run: mvn -f /tmp/runtime-deps-scan/pom.xml dependency:resolve -q

      - name: Install Snyk CLI
        run: npm install -g snyk

      - name: Snyk scan runtime dependencies
        run: snyk test --file=/tmp/runtime-deps-scan/pom.xml --severity-threshold=medium
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  # ALTERNATIVE: naive container scan of the application image produced by
  # mvn install — what a registry-integrated scanner would report on the pushed
  # image. The image is only an init container (Alpine base + JARs copied to
  # /opt/local-lib at deploy time); it never runs the service, so OS-package
  # findings are irrelevant and Java findings duplicate the CI SDK scan.
  # Note: this job does not use the runtime_version input.
  snyk-app-image-scan:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Configure Akka repository
        env:
          AKKA_REPO_URL: ${{ secrets.AKKA_REPO_URL }}
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<EOF
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
            xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
            xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0
                                https://maven.apache.org/xsd/settings-1.0.0.xsd">
            <profiles>
              <profile>
                <id>akka-repo</id>
                <repositories>
                  <repository>
                    <id>akka-repository</id>
                    <url>${AKKA_REPO_URL}</url>
                  </repository>
                </repositories>
                <pluginRepositories>
                  <pluginRepository>
                    <id>akka-plugin-repository</id>
                    <url>${AKKA_REPO_URL}</url>
                  </pluginRepository>
                </pluginRepositories>
              </profile>
            </profiles>
            <activeProfiles>
              <activeProfile>akka-repo</activeProfile>
            </activeProfiles>
          </settings>
          EOF

      - name: Build container image
        run: mvn clean install -DskipTests

      - name: Show built image
        run: docker images akka-pulse

      - name: Install Snyk CLI
        run: npm install -g snyk

      - name: Snyk scan application image
        run: snyk container test akka-pulse:latest --severity-threshold=medium
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
